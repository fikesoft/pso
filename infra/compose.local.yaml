# PostgreSQL local numai; Docker nu a fost disponibil pentru verificare în execuția inițială.
# Pornire: POSTGRES_OWNER_PASSWORD=<secret local> docker compose -f infra/compose.local.yaml up -d
# După pnpm install, pe un volum NOU și fără .env existent:
# PGUSER=pos_local_owner PGPASSWORD=<același secret> node scripts/ci-db.mjs
# Nu folosiți simultan clusterul nativ al proiectului și Docker pe același port.
# Helperul refuză configurațiile existente; nu ștergeți volume pentru a ocoli refuzul.
name: pos-local
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: pos_local_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set a local database owner password}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_LOCAL_PORT:-55432}:5432'
    volumes:
      - pos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos_local_owner -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  pos_pgdata:
