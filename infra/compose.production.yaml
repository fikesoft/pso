# TEMPLATE ONLY. No deployment is performed. Secrets/private network/TLS need operator configuration.
name: pos
x-common: &common
  image: pos-foundation:0.1.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: pos_cluster_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    volumes: [pgdata:/var/lib/postgresql]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pos_cluster_owner']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  api:
    <<: *common
    env_file: ${TENANT_ENV_FILE:?Use a private tenant-only env file}
    environment: { API_BIND_HOST: 0.0.0.0 }
    networks: [data, tenant]
    volumes: [private_files:/app/.local]
    command: [node, --import, tsx, apps/api/src/public-server.ts]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    <<: *common
    environment: { TENANT_API_URL: 'http://api:4000' }
    networks: [tenant]
    command:
      [
        node,
        apps/web/node_modules/next/dist/bin/next,
        start,
        apps/web,
        --hostname,
        0.0.0.0,
        --port,
        '3000',
      ]
  worker:
    <<: *common
    profiles: [background-jobs]
    env_file: ${WORKER_ENV_FILE:?Use a private worker-only env file}
    networks: [data]
    command: [node, --import, tsx, apps/worker/src/main.ts]
  platform-api:
    <<: *common
    profiles: [private-platform]
    env_file: ${PLATFORM_ENV_FILE:?Private platform-only env required}
    environment: { PLATFORM_BIND_HOST: 0.0.0.0 }
    networks: [data, control]
    command: [node, --import, tsx, apps/api/src/platform-server.ts]
  platform-web:
    <<: *common
    profiles: [private-platform]
    environment: { PLATFORM_API_URL: 'http://platform-api:4001' }
    networks: [control]
    command:
      [
        node,
        apps/platform-web/node_modules/next/dist/bin/next,
        start,
        apps/platform-web,
        --hostname,
        0.0.0.0,
        --port,
        '3001',
      ]
  proxy:
    image: nginx:1.28.2-alpine
    profiles: [operator-configured-proxy]
    ports: ['443:443']
    networks: [tenant]
    volumes:
      - ${NGINX_TENANT_CONFIG:?Provide verified TLS config}:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTS_DIR:?Provide certificates}:/etc/nginx/certs:ro
    restart: unless-stopped
networks:
  data: { internal: true }
  tenant: {}
  control: { internal: true }
volumes:
  pgdata:
  private_files:
secrets:
  db_owner_password:
    file: ${DB_OWNER_PASSWORD_FILE:?Provide private secret file}
